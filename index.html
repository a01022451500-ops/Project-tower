<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현장별 교섭현황</title>
<style>
:root{--bg:#050a20;--card:#1d2a40;--line:#33445e;--muted:#8f9db0;--blue:#4ea1ff;--purple:#c98cff;--yellow:#fff2cc;--text:#f5f7fb} *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif} header{position:sticky;top:0;z-index:10;background:rgba(5,10,32,.97);padding:18px 14px 12px;border-bottom:1px solid #202c45;backdrop-filter:blur(8px)} h1{font-size:21px;margin:0 0 12px;font-weight:800} .search-box{position:relative;width:100%} .search{width:100%;height:40px;border:1px solid #33445e;border-radius:9px;background:#071126;color:white;padding:0 36px 0 12px;font-size:14px;outline:none} .search:focus{border-color:var(--blue)} .clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#6b7c96;font-size:16px;cursor:pointer;display:none;padding:4px} .clear-btn:hover{color:#fff} .tabs{display:flex;gap:7px;overflow-x:auto;padding:11px 0 2px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none} .tab{border:1px solid #3b4a61;background:#172238;color:#b9c3d2;border-radius:20px;padding:7px 12px;white-space:nowrap;font-weight:700;font-size:13px;cursor:pointer} .tab.active{background:#287fe0;border-color:#4299ff;color:#fff} .subtabs{padding:4px 14px 10px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.subtabs::-webkit-scrollbar{display:none} .count{font-size:12px;color:#8190a6;margin:4px 0 10px;padding:0 14px} .list{padding:0 12px 20px} .card{position:relative;background:linear-gradient(145deg,#1d2a40,#1a263a);border:1px solid var(--line);border-radius:15px;padding:14px 12px;margin:10px 0;box-shadow:0 3px 8px rgba(0,0,0,.16);cursor:pointer;transition:transform 0.1s ease} .card:active{transform:scale(0.995)} .top{display:flex;gap:10px;align-items:flex-start} .branch{width:52px;min-width:52px;height:44px;border-radius:12px;background:#07132f;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4ea1ff;font-size:12px;font-weight:800;line-height:1.2} .branch .idx{font-size:10px;color:#8f9db0;font-weight:normal;margin-bottom:1px} .main{min-width:0;flex:1} .name{font-size:16px;font-weight:800;line-height:1.3;margin:1px 0 5px;word-break:keep-all} .meta{font-size:12px;color:#8997aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .right{text-align:right;min-width:105px} .install{color:#61b0ff;font-size:12px;font-weight:700} .numbers{color:#d294ff;font-size:12px;margin-top:4px;font-weight:700} .body{margin-top:10px;border-top:1px solid rgba(130,150,180,.16);padding-top:9px} .neg{font-size:13px;color:#d9e0eb;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden} .extra{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px} .chip{font-size:11px;color:#9facbd;background:#152239;border:1px solid #2e3e57;border-radius:6px;padding:3px 6px} .changed{background:var(--yellow)!important;color:#222!important;border-radius:4px;padding:1px 3px;font-weight:700} .empty{text-align:center;color:#77869b;padding:40px 10px} .details{display:none;margin-top:8px;font-size:12px;color:#c6cfdd;line-height:1.55;border-top:1px dashed #2d3d57;padding-top:8px} .card.open .details{display:block} .more{color:#64aaff;font-size:11px;margin-top:5px;text-align:right} .rental{margin:15px 12px 30px;background:#121e33;border:1px solid #293a54;border-radius:12px;padding:12px} .rental h2{font-size:15px;margin:0 0 10px;color:#4ea1ff} .rrow{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #26364e;padding:8px 0;font-size:12px} .rrow:first-of-type{border-top:0} .rrow b{color:#e2e8f0;min-width:100px} .rrow span{color:#9facbd;text-align:right}
</style>
</head>
<body>

<header>
  <h1>현장별 교섭현황</h1>
  <div class="search-box">
    <input type="text" id="search" class="search" placeholder="현장명, 구분, 임대사 등 검색...">
    <button id="clear-btn" class="clear-btn">✕</button>
  </div>
  <div id="tabs" class="tabs"></div>
  <div id="subtabs" class="subtabs"></div>
</header>

<div id="count" class="count"></div>
<main id="list" class="list"></main>
<section id="rentals-section" class="rental"></section>

<script>
let DATA = null;
let sheetNames = [];
let sheet = '';
let branch = '전체';
const branchOrder = ['전체', '중부', '남부', '남서', '북부', '북서', '서부', '동부', '용인'];
let q = '';

async function loadData() {
  try {
    const res = await fetch('data.json');
    if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    DATA = await res.json();
    sheetNames = Object.keys(DATA.sheets);
    sheet = sheetNames[0];
    render();
  } catch (err) {
    document.getElementById('list').innerHTML = '<div class="empty">data.json 파일을 불러오는데 실패했습니다. 동일한 경로에 파일이 존재하는지 확인하세요.</div>';
    console.error('Failed to load data:', err);
  }
}

function esc(x) {
  return String(x ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function short(x, n = 95) {
  x = String(x ?? '').replace(/\s+/g, ' ').trim();
  return x.length > n ? x.slice(0, n) + '…' : x;
}

function nums(r) {
  let a = [];
  if (r['총대수']) a.push('총 ' + r['총대수']);
  if (r['배정대수']) a.push('배정 ' + r['배정대수']);
  if (r['설치대수']) a.push('설치 ' + r['설치대수']);
  return a.join(' · ');
}

function isChanged(sheetName, index, col) {
  const marks = DATA.changed?.[sheetName] || [];
  return marks.some(m => m[0] === index && (m[1] === undefined || m.slice(1).includes(col)));
}

function mark(v, s, i, c) {
  return isChanged(s, i, c) ? '<span class="changed">' + esc(v) + '</span>' : esc(v);
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = sheetNames.map(s => 
    `<button class="tab ${s === sheet ? 'active' : ''}" onclick="setSheet('${s}')">${s === '현장별교섭현황' ? '대형' : s}</button>`
  ).join('');
}

function renderBranches() {
  document.getElementById('subtabs').innerHTML = branchOrder.map(b => 
    `<button class="tab ${b === branch ? 'active' : ''}" onclick="setBranch('${b}')">${b}</button>`
  ).join('');
}

function renderRentals() {
  const section = document.getElementById('rentals-section');
  if (!DATA || !DATA.rentals || DATA.rentals.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  section.innerHTML = `<h2>임대사별 약속사항</h2>` + DATA.rentals.map(r => `
    <div class="rrow">
      <b>${esc(r.임대사)}</b>
      <span>${esc(r.약속사항)}</span>
    </div>
  `).join('');
}

function render() {
  if (!DATA) return;
  renderTabs();
  renderBranches();
  const searchInput = document.getElementById('search');
  const clearBtn = document.getElementById('clear-btn');
  clearBtn.style.display = searchInput.value ? 'block' : 'none';

  let arr = DATA.sheets[sheet] || [];
  let filtered = arr.filter((r) => {
    let text = Object.values(r).join(' ').toLowerCase();
    return (branch === '전체' || r['구분'] === branch) && (!q || text.includes(q.toLowerCase()));
  });

  document.getElementById('count').textContent = `${sheet === '현장별교섭현황' ? '대형현장' : '소형현장'} · ${filtered.length}개 현장 (업데이트: ${DATA.updated || '-'})`;

  const listEl = document.getElementById('list');
  listEl.innerHTML = filtered.length ? filtered.map((r, idx) => card(r, arr.indexOf(r), idx + 1)).join('') : '<div class="empty">조건에 맞는 현장이 없습니다.</div>';
  renderRentals();
}

function card(r, i, seq) {
  let detail = [
    r['현장주소'] ? `주소: ${mark(r['현장주소'], sheet, i, 11)}` : '',
    r['현장사항'] ? `현장사항: ${esc(r['현장사항'])}` : '',
    r['현장제원'] ? `현장제원: ${esc(r['현장제원'])}` : ''
  ].filter(Boolean).join('<br>');

  return `<article class="card" onclick="this.classList.toggle('open')">
    <div class="top">
      <div class="branch">
        <span class="idx">No.${seq}</span>
        <span>${mark(r['구분'] || '-', sheet, i, 0)}</span>
      </div>
      <div class="main">
        <div class="name">${mark(r['현장명'], sheet, i, 2)}</div>
        <div class="meta">${r['임대사'] ? mark('임대사 · ' + r['임대사'], sheet, i, 3) : '임대사 미정'}${r['현장제원'] ? ' · ' + esc(r['현장제원']) : ''}</div>
      </div>
      <div class="right">
        ${r['설치예정'] ? '<div class="install">' + mark(r['설치예정'], sheet, i, 5) + '</div>' : ''}
        <div class="numbers">${mark(nums(r), sheet, i, 7)}</div>
      </div>
    </div>
    <div class="body">
      ${r['교섭및쟁의사항'] ? '<div class="neg">' + mark(short(r['교섭및쟁의사항']), sheet, i, 10) + '</div>' : '<div class="neg" style="color:#718097">교섭내용 없음</div>'}
      <div class="extra">
        ${r['현설예정'] ? '<span class="chip">현설 ' + mark(r['현설예정'], sheet, i, 4) + '</span>' : ''}
        ${r['현장사항'] ? '<span class="chip">' + mark(r['현장사항'], sheet, i, 6) + '</span>' : ''}
      </div>
      ${detail ? '<div class="details">' + detail + '</div><div class="more">카드 터치 → 상세보기</div>' : ''}
    </div>
  </article>`;
}

function setSheet(s) {
  sheet = s;
  branch = '전체';
  render();
}

function setBranch(b) {
  branch = b;
  render();
}

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', e => {
  q = e.target.value;
  render();
});

document.getElementById('clear-btn').addEventListener('click', () => {
  searchInput.value = '';
  q = '';
  render();
});

loadData();
</script>
</body>
</html>
